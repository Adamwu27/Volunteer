<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自我考核 · 如何做好特奥志愿者</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#EEF2F7;color:#16283F;
 font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;
 -webkit-text-size-adjust:100%;line-height:1.6}
.bar{background:#123A63;color:#fff;padding:14px 18px;display:flex;
 align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar h1{font-size:17px;margin:0;font-weight:700}
.bar a{color:#DDEAF6;font-size:13px;text-decoration:none;border:1px solid rgba(255,255,255,.4);
 border-radius:8px;padding:6px 10px;white-space:nowrap}
.wrap{max-width:760px;margin:0 auto;padding:20px 14px 40px}
.meta{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.tag{background:#1B62A6;color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:4px 12px}
.prog{flex:1;min-width:120px;height:7px;border-radius:7px;background:#D8E3EE;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#D43B3B;transition:width .35s ease}
.count{font-size:13px;color:#5A6B80;font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:#fff;border:1px solid #D8E3EE;border-radius:14px;
 box-shadow:0 14px 44px rgba(20,45,80,.10);padding:18px 20px 22px}
.ill{width:100%;max-width:260px;display:block;margin:0 auto 12px}
.qcat{font-size:12px;color:#D43B3B;font-weight:700;letter-spacing:.06em}
.qtitle{font-size:19px;font-weight:700;margin:6px 0 16px;color:#123A63;line-height:1.55}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
 font:inherit;font-size:15px;color:#16283F;background:#F8FAFD;border:1.5px solid #D8E3EE;
 border-radius:10px;padding:12px 14px;cursor:pointer;transition:.16s}
.opt:hover:not(:disabled){border-color:#1B62A6;background:#EAF2FA}
.opt:focus-visible{outline:3px solid #F5B841;outline-offset:2px}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;background:#E7EEF6;color:#123A63;
 font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.correct{border-color:#1B8A5A;background:#E8F6EE}
.opt.correct .k{background:#1B8A5A;color:#fff}
.opt.wrong{border-color:#D43B3B;background:#FDEDEA}
.opt.wrong .k{background:#D43B3B;color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:14px;display:none}
.fb.show{display:block}
.fb.ok{background:#E8F6EE;border-left:4px solid #1B8A5A}
.fb.no{background:#FDEDEA;border-left:4px solid #D43B3B}
.fb b{display:block;margin-bottom:3px}
.fb.ok b{color:#1B8A5A}
.fb.no b{color:#D43B3B}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{font:inherit;font-size:15px;font-weight:700;border:0;border-radius:10px;
 padding:12px 22px;cursor:pointer;transition:.16s}
.btn.pri{background:#D43B3B;color:#fff}
.btn.pri:hover{background:#b93228}
.btn.sec{background:#EAF2FA;color:#123A63;border:1px solid #D8E3EE}
.btn[hidden]{display:none}
.btn:focus-visible{outline:3px solid #F5B841;outline-offset:2px}
.hero{text-align:center;padding:8px 0 18px}
.hero h2{font-size:24px;color:#123A63;margin:8px 0}
.hero p{color:#5A6B80;margin:6px 0;font-size:14px}
.hero .big{width:100%;max-width:300px;margin:6px auto 0;display:block}
.badge{display:inline-block;font-size:16px;font-weight:700;border-radius:999px;
 padding:8px 24px;margin:4px 0 10px}
.badge.pass{background:#E8F6EE;color:#1B8A5A}
.badge.fail{background:#FBF1DC;color:#A86E00}
.score{font-size:46px;font-weight:800;color:#D43B3B;line-height:1.1}
.score small{font-size:18px;color:#5A6B80;font-weight:600}
.quote{margin:14px auto;max-width:600px;background:#FBF1DC;border-radius:10px;
 padding:14px 18px;font-size:16px;font-weight:700;color:#123A63}
.review{margin-top:18px;border-top:1px solid #D8E3EE;padding-top:14px;text-align:left}
.review h3{font-size:15px;color:#123A63;margin:0 0 8px}
.review .ri{font-size:14px;border-left:3px solid #D43B3B;padding:6px 0 6px 12px;margin-bottom:8px;color:#5A6B80}
.review .ri b{color:#16283F}
details.more{margin-top:16px;border:1px solid #D8E3EE;border-radius:10px;background:#F8FAFD}
details.more summary{cursor:pointer;padding:12px 16px;font-weight:700;color:#123A63;font-size:14px}
details.more .body{padding:0 16px 14px;font-size:13.5px;color:#5A6B80}
details.more .body div{padding:8px 0;border-top:1px solid #E7EEF6}
details.more .body b{color:#1B8A5A}
.foot{text-align:center;color:#8492A4;font-size:12px;margin-top:18px;line-height:1.7}
@media(max-width:420px){
 .bar h1{font-size:15px}
 .qtitle{font-size:17px}
 .opt{font-size:14px;padding:10px 12px}
 .acts .btn{flex:1;text-align:center}
}
</style>
</head>

 </section>

 {cat:'安全边界', icon:'door', q:'活动结束后，一位运动员邀请你单独去一个封闭的房间聊天。从安全准则考虑，比较妥当的是？',
  opts:['欣然同意，两个人交流更深入','婉拒，尽量避免与特奥运动员两人单独处于室内','关上门但开着窗就可以','让其他志愿者在门外等'], a:1,
  exp:'资料明确：志愿者尽量不要和特奥运动员两人单独处于室内。'}
 ];

 function cheers(s){
  if(s===10) return '满分！你已把做好特奥志愿者的要领全部装进心里，随时可以上岗啦！';
  if(s===9) return '太出色了！只差一点点就满分，你对志愿服务的理解非常到位。';
  if(s===8) return '很棒！你已经是一位知识扎实的特奥志愿者了。';
  if(s===7) return '不错！关键要点都掌握了，再看一遍错题就更稳了。';
  if(s===6) return '合格！你已具备做好特奥志愿者的基础知识，为你勇敢尝试点赞！';
  if(s===5) return '差一点就合格啦！回看解析再挑战一次，你一定可以。';
  if(s===4) return '继续加油！复习一下志愿行为技巧和安全准则，会有明显进步。';
  if(s===3) return '每一次了解都值得肯定。建议回到说明资料再看一遍，然后重新挑战。';
  if(s===2) return '别灰心，勇敢尝试本身就是胜利。慢慢来，再读一遍资料。';
  if(s===1) return '没关系，从零开始了解也是一种收获。看看解析，再来一次。';
  return '勇敢尝试就是胜利。先看看答案解析，再重新挑战吧。';
 }

 var L=['A','B','C','D'], i=0, score=0, locked=false;
 var $=function(id){return document.getElementById(id);};
 function view(id){['home','quiz','result'].forEach(function(v){$(v).hidden=(v!==id);});window.scrollTo(0,0);}
 function buildAll(){
  var h='';
  QS.forEach(function(it,n){
   h+='<div><b>'+(n+1)+'. '+it.q+'</b><br>'+it.opts.map(function(o,j){return L[j]+'. '+o;}).join('　')+
      '<br><b>正确答案：'+L[it.a]+'</b>　'+it.exp+'</div>';
  });
  $('answerAll').innerHTML=h;
 }
 function render(){
  var it=QS[i]; locked=false;
  $('cat').textContent='情境题 '+(i+1)+' / 10';
  $('fill').style.width=(i/10*100)+'%';
  $('score').textContent=score;
  $('ill').innerHTML=ILL[it.icon]||'';
  $('qcat').textContent=it.cat;
  $('qtitle').textContent=it.q;
  var box=$('opts'); box.innerHTML='';
  it.opts.forEach(function(t,j){
   var b=document.createElement('button'); b.className='opt'; b.type='button';
   b.innerHTML='<span class="k">'+L[j]+'</span><span>'+t+'</span>';
   b.addEventListener('click',function(){answer(j,b);});
   box.appendChild(b);
  });
  $('fb').className='fb'; $('next').hidden=true;
 }
 function answer(c,btn){
  if(locked)return; locked=true;
  var it=QS[i], right=it.a, all=$('opts').children, j;
  for(j=0;j<all.length;j++) all[j].disabled=true;
  if(c===right){score++;btn.classList.add('correct');}
  else{btn.classList.add('wrong');all[right].classList.add('correct');}
  $('score').textContent=score;
  var fb=$('fb'); fb.className='fb show '+(c===right?'ok':'no');
  $('verdict').textContent=c===right?'回答正确！':'再想想～';
  $('exp').textContent=(c===right?'':'正确答案是 '+L[right]+'。')+it.exp;
  $('next').textContent=(i===9)?'查看结果 →':'下一题 →';
  $('next').hidden=false; $('next').focus();
 }
 function next(){if(i<9){i++;render();}else result();}
 function result(){
  view('result'); $('fill').style.width='100%';
  var pass=score>=6;
  $('badge').className='badge '+(pass?'pass':'fail');
  $('badge').textContent=pass?'合格 ✓':'继续加油';
  $('final').textContent=score;
  $('quote').textContent=cheers(score);
  var wrong=[]; QS.forEach(function(it,n){if(wrongSel[n]!==undefined&&wrongSel[n]!==it.a)wrong.push(n);});
  if(wrong.length){
   var h=''; wrong.forEach(function(n){h+='<div class="ri"><b>'+(n+1)+'. '+QS[n].q+'</b><br>你的答案：'+L[wrongSel[n]]+'　正确答案：'+L[QS[n].a]+'</div>';});
   $('reviewList').innerHTML=h; $('review').hidden=false;
  }else{$('review').hidden=true;}
 }
 var wrongSel={};
 function start(){i=0;score=0;wrongSel={};view('quiz');render();}

 $('start').addEventListener('click',start);
 $('retry').addEventListener('click',start);
 $('next').addEventListener('click',next);
 $('quit').addEventListener('click',function(){view('home');});
 $('back').setAttribute('href','volunteer-zh.html#p=21');
 document.addEventListener('keydown',function(e){
  if($('quiz').hidden)return;
  var k=e.key||e.keyCode;
  if(!locked&&/^[1-4]$/.test(k)){var b=$('opts').children[+k-1];if(b)b.click();}
  else if(!locked&&/^[a-d]$/i.test(k)){var b2=$('opts').children[L.indexOf(k.toUpperCase())];if(b2)b2.click();}
  else if(locked&&(k==='Enter'||k==='ArrowRight'))next();
 });
 // 记录选项以便回顾
 var origAnswer=answer;
 answer=function(c,btn){wrongSel[i]=c;origAnswer(c,btn);};
 buildAll(); view('home');
})();
</script>
